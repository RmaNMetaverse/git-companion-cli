name: Test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check src dev
  installer-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GC_INSTALL_ROOT: ${{ runner.temp }}/Git Companion installer test
      GC_BIN_DIR: ${{ runner.temp }}/Git Companion command bin
      GC_SETUP_NO_PATH: '1'
      GC_SETUP_NONINTERACTIVE: '1'
      # Exercise the automatic Python installation even on runners with preinstalled Python.
      GC_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install hatchling
      - run: python -m hatchling build -t wheel -d dev/artifacts
      - run: python -m dev.tools.build_installers dev/artifacts/git_companion_cli-0.1.0-py3-none-any.whl
      - if: runner.os == 'Windows'
        shell: cmd
        run: setup-windows.cmd
      - if: runner.os == 'macOS'
        run: sh setup-macos.command
      - if: runner.os == 'Linux'
        run: sh setup-linux.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          & "$env:GC_BIN_DIR/git-companion.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os != 'Windows'
        run: |
          cd "$RUNNER_TEMP"
          "$GC_BIN_DIR/git-companion" --version

